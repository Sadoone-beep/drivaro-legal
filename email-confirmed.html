<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail bevestigd — Drivaro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fc;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            padding: 48px 32px;
            text-align: center;
        }

        .checkmark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-size: 36px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1a1a2e;
        }

        .subtitle {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #374151;
            margin-bottom: 12px;
        }

        .message-en {
            font-size: 15px;
            line-height: 1.6;
            color: #6b7280;
            font-style: italic;
            margin-bottom: 32px;
        }

        .divider {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 0 0 24px 0;
        }

        .instruction {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
        }

        .instruction-en {
            font-size: 13px;
            color: #9ca3af;
            font-style: italic;
        }

        .brand {
            margin-top: 32px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="checkmark" aria-hidden="true">&#10003;</div>
        <h1>E-mail bevestigd</h1>
        <p class="subtitle">Email confirmed</p>

        <p class="message">Je e-mailadres is bevestigd. Je kunt nu inloggen in de Drivaro app.</p>
        <p class="message-en">Your email has been confirmed. You can now sign in to the Drivaro app.</p>

        <hr class="divider">

        <p class="instruction">Sluit deze pagina en open Drivaro op je telefoon.</p>
        <p class="instruction-en">Close this page and open Drivaro on your phone.</p>

        <p class="brand">Drivaro</p>
    </div>
</body>
</html>
